<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lanroam</title>
    <script>
      // Theme before the first paint: the stylesheet defaults to dark, so a
      // light window would otherwise flash dark until React applies it
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem("lanroam-theme");
        } catch (_) {}
        var light =
          pref === "light" ||
          (pref !== "dark" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

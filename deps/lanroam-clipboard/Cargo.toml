[package]
name = "lanroam-clipboard"
description = "Lanroam clipboard layer: reading and writing the system clipboard, content as it travels between devices"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true

# No networking here on purpose, as in lanroam-input: the Windows code can be
# checked from a Mac with
# `cargo clippy -p lanroam-clipboard --target x86_64-pc-windows-msvc`

[dependencies]
arboard = { workspace = true }
blake3 = { workspace = true }
png = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSPasteboard"] }
objc2-foundation = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_DataExchange"] }

[lints]
workspace = true

[workspace]
resolver = "3"
members = [
    "deps/lan-kit",
    "deps/lanroam-input",
    "deps/lanroam-core",
    "deps/lanroam-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
authors = ["Zero <zero9501@outlook.com>"]
description = "Share one keyboard and mouse across the computers on your LAN."
homepage = "https://github.com/zlx2019/lanroam"
repository = "https://github.com/zlx2019/lanroam"
license = "MIT"
readme = "README.md"

[workspace.dependencies]
lan-kit = { path = "deps/lan-kit" }
lanroam-input = { path = "deps/lanroam-input" }
lanroam-core = { path = "deps/lanroam-core" }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
] }
# aws-lc-rs is the crypto backend everywhere (rustls, quinn), matching the
# sibling apps; TLS 1.2 support is compiled out since only TLS 1.3 is spoken
rustls = { version = "0.23", default-features = false, features = [
    "aws_lc_rs",
    "logging",
    "std",
] }
rustls-pki-types = "1"
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-aws-lc-rs",
] }
bytes = "1"
# rcgen generates keys with aws-lc-rs too, so ring never enters the build
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
mdns-sd = "0.21"
socket2 = { version = "0.6", features = ["all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# Desk group joins: a PIN-authenticated key exchange, and hex for its bytes
# in the JSON control messages
spake2 = "0.4"
hex = { version = "0.4", features = ["serde"] }
getrandom = "0.4"
hostname = "0.4"
os_info = { version = "3", default-features = false }
clap = { version = "4", features = ["derive"] }
# Platform input APIs, each compiled only on its own OS (same versions as the
# sibling apps, which pull them in through Tauri)
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFCGTypes",
    "CFDate",
    "CFMachPort",
    "CFNumber",
    "CFRunLoop",
    "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGDirectDisplay",
    "CGError",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
    "libc",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

### Lint rules shared by every member (opt in with `[lints] workspace = true`)
[workspace.lints.rust]
unsafe_code = "warn"      # platform input hooks need unsafe; each use must be justified
missing_docs = "warn"     # public items must be documented

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"

### Release profile
[profile.release]
lto = "thin"          # link-time optimization for runtime performance
codegen-units = 1     # single codegen unit: better optimization, slower builds
strip = true          # strip debug symbols to shrink the binaries

### Dev profile
[profile.dev]

name: CI

# When pushing the main branch
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & Clippy & Doc
    if: github.repository != 'zlx2019/rust-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      # The app embeds the built frontend, so it has to exist before any
      # cargo build; `pnpm build` type-checks it on the way
      - name: Build frontend
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile && pnpm build
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo doc
        run: cargo doc --no-deps --workspace --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Platform code (input hooks, clipboard, ...) is cfg-gated per OS, so
  # clippy has to see the v1 targets as well
  lint-platform:
    name: Clippy (${{ matrix.os }})
    if: github.repository != 'zlx2019/rust-template'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      # The app embeds the built frontend, so it has to exist before any
      # cargo build; `pnpm build` type-checks it on the way
      - name: Build frontend
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile && pnpm build
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The Windows helper scripts are never run on the dev machine, so at
      # least make sure they parse
      - name: PowerShell scripts parse
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $errors | Format-List; $failed = $true }
          }
          if ($failed) { exit 1 }

  test:
    name: Test (${{ matrix.os }})
    if: github.repository != 'zlx2019/rust-template'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      # The app embeds the built frontend, so it has to exist before any
      # cargo build; `pnpm build` type-checks it on the way
      - name: Build frontend
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile && pnpm build
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: cargo nextest
        run: cargo nextest run --workspace --all-features --no-tests pass

  deny:
    name: Cargo Deny
    if: github.repository != 'zlx2019/rust-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  typos:
    name: Typos
    if: github.repository != 'zlx2019/rust-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.48.0
